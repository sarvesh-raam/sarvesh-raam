name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:

  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Left card: profile, stats, repositories, languages
      - uses: gh-metrics/metrics@master
        with:
          filename: metrics-left.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: sarvesh-raam
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_padding: 0, 15 + 10%

          # Base Configuration
          repositories_affiliations: owner
          repositories_batch: 100

          # Introduction plugin
          plugin_introduction: yes
          plugin_introduction_title: yes

          # Languages plugin
          plugin_languages: yes
          plugin_languages_ignored: jupyter notebook
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_indepth: yes

          # Lines of code plugin
          plugin_lines: yes

          # Follow-up plugin
          plugin_followup: yes
          plugin_followup_sections: repositories

      # Right card: contributions, calendar, people, achievements
      - uses: gh-metrics/metrics@master
        with:
          filename: metrics-right.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: sarvesh-raam
          template: classic
          base: metadata
          config_timezone: Asia/Kolkata
          config_padding: 0, 15 + 10%

          # Base Configuration
          repositories_affiliations: owner
          repositories_batch: 100

          # Notable contributions
          plugin_notable: yes

          # ISO Calendar plugin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # People plugin
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following

          # Achievements plugin
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_achievements_ignored: manager, member, projects
